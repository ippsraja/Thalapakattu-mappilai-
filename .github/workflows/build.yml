name: Build and Release EXE
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install Tools
      run: |
        pip install pywebview pyinstaller
    - name: Create App Script
      run: |
        Set-Content -Path app.py -Value "import webview`nwebview.create_window('Hotel Billing', 'index.html')`nwebview.start()"
    - name: Build Windows EXE
      run: |
        pyinstaller --onefile --noconsole --name "HotelBillingApp" --add-data "index.html;." app.py
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0
        name: Hotel Billing App v1.0
        files: dist/HotelBillingApp.exe
